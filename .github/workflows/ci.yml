name: CI

on:
  # The gate: every change reaches main through a PR, so this is the run that
  # branch protection should require.
  pull_request:
    branches: [main]
  # Still useful with main protected — a merged PR is itself a push to main, so
  # this re-runs CI on the real post-merge tree and catches two PRs that were
  # each green alone but break once combined.
  push:
    branches: [main]

# No secrets are needed, and PRs from forks should not get more than this.
permissions:
  contents: read

# A new push to a PR cancels the run still in flight for that PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # `npm run build` is `tsc && vite build`, so this is the typecheck too.
      - name: Typecheck and build
        run: npm run build

      # NOTE: src/pages/users/Users.test.tsx makes a real HTTP request to
      # jsonplaceholder.typicode.com — there are no mocks in this repo. If this
      # step fails with a network/timeout error rather than an assertion, the
      # external API is the likely cause, not the PR. Mocking that call would
      # make CI hermetic.
      - name: Test
        run: npm run test:coverage -- --ci

      - name: Upload coverage
        # Runs even when the tests fail, so a red PR still has a coverage report.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore
